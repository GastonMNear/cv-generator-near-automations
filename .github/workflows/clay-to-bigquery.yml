name: Clay lead to BigQuery

on:
  repository_dispatch:
    types:
      - clay_lead_to_bigquery
  workflow_dispatch:
    inputs:
      payload_json:
        description: JSON payload to test, usually {"lead":{...}}
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  insert-lead:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: near-outbound-analytics
          credentials_json: ${{ secrets.GCP_BQ_SERVICE_ACCOUNT_JSON }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Insert Clay lead into BigQuery
        env:
          BIGQUERY_PROJECT_ID: near-outbound-analytics
          BIGQUERY_DATASET_ID: outbound
          BIGQUERY_TABLE_ID: leads
          CLAY_GITHUB_INGEST_SECRET: ${{ secrets.CLAY_GITHUB_INGEST_SECRET }}
          MANUAL_PAYLOAD_JSON: ${{ github.event.inputs.payload_json || '' }}
        run: node scripts/insert_clay_lead_to_bigquery.mjs
